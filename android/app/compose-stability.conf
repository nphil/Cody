// Classes the Compose compiler must treat as stable.
//
// Everything under dev.cody.shared is an immutable data class over primitives,
// other such classes, and read-only Lists. Compose infers `List<T>` as UNSTABLE
// because the interface permits a mutable implementation, which would make every
// transcript row recompose on any state change (docs/android-ux.md 6.3).
//
// The spec's first fix is @Immutable + kotlinx.collections.immutable. That is not
// available here by construction: :shared is a multiplatform module with no
// androidx dependency, so it cannot carry a Compose annotation at all. This file
// is the documented alternative for exactly that situation, and it is the better
// answer here: same stability outcome, one fewer dependency, and the models stay
// usable from a target that has never heard of Compose.
//
// THE COST, which is real: this file is a promise, not enforcement. It suppresses
// the inference; it does not make anything immutable. A List field declared
// stable that someone later mutates in place will silently fail to recompose, and
// a missing-update bug is far harder to find than an over-recomposition one. Two
// obligations therefore ride with it:
//   1. models under dev.cody.shared.model are construct-only -- no `var`, no
//      mutating members, no exposed builders;
//   2. nothing hands a model a collection it still holds a reference to.
// The Compose stability report is the only thing that catches a violation of the
// spirit here, because a wildcard also rots silently when a class is renamed.
dev.cody.shared.model.*
dev.cody.shared.backend.BackendCapabilities
dev.cody.shared.backend.BackendIdentity
dev.cody.shared.backend.ServerConfig
dev.cody.shared.backend.StoredCredentials
dev.cody.shared.presentation.TranscriptRow
dev.cody.shared.presentation.Transcript
dev.cody.shared.presentation.StreamingTurn
dev.cody.shared.presentation.RunningTool
dev.cody.shared.presentation.TurnPhase
dev.cody.shared.presentation.TurnPhase.Tools
dev.cody.shared.presentation.ChatState
// The session list. Not part of the streaming path, but the Compose report had
// it as `unstable state: SessionsState`, which makes every visible session row
// recompose on any change to the list -- including the running-set change that
// arrives on every turn boundary. Same construct-only data class over read-only
// collections as everything above, so the promise holds.
dev.cody.shared.presentation.SessionsState
// Device-log models (dev.cody.shared.logs). LogSnapshot holds List<LogEntry>,
// so without this every visible log row recomposes on every 10 Hz emission
// instead of only the rows whose count actually changed. LogRing hands out
// fresh LogEntry instances and reuses the previous instance verbatim when a row
// is unchanged, which is what makes the promise above true here.
dev.cody.shared.logs.*
// Termux command-runner models (dev.cody.shared.termux). The Compose report had
// `unstable state: TerminalState`, `unstable entry: TerminalEntry` and
// `unstable stream: TermuxStream`, which means every visible scrollback row
// recomposes whenever any command finishes -- including the row-by-row cost of
// re-measuring monospace output blocks, which is the expensive part.
//
// The promise holds here for the same reason it does above: every type in the
// package is a construct-only data class, object or enum over primitives,
// Strings and other such types. The one collection is TermuxRequest.arguments,
// which TermuxCommands builds fresh and hands over. TerminalState.entries is
// likewise never mutated in place -- TerminalModel only ever replaces it, and
// the scrollback trim is takeLast (a copy) rather than subList (a view that
// would alias the previous list).
dev.cody.shared.termux.*
dev.cody.shared.presentation.TerminalState
dev.cody.shared.presentation.TerminalEntry
// Settings models (dev.cody.shared.presentation, settings half). Two construct-only
// data classes over an enum and a Boolean; the enums beside them (ThemeChoice,
// CapabilityId, PrereqLevel, TermuxFix) need no entry because the compiler treats
// an enum as stable wherever it was compiled. CapabilityRow is the one that
// matters: it is a parameter of the About list's row composable, and left
// unstable every capability row recomposes when any of them changes.
dev.cody.shared.presentation.CapabilityRow
dev.cody.shared.presentation.TermuxPrereq
