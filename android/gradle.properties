# 3 GB heap is sized for the GitHub-hosted runner (7 GB RAM, 4 vCPU) as much as
# for a workstation: AGP's default heap runs out during R8 on a Compose app.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true

kotlin.code.style=official
