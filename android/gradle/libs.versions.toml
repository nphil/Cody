# Single source of dependency versions. Every version below was resolved
# against the live repositories, not copied from a template.

[versions]
agp = "9.3.1"
kotlin = "2.4.10"

# compileSdk/targetSdk track the newest STABLE platform the SDK manager offers
# (Android SDK Platform 37.0). minSdk 29 = Android 10: the floor the
# architecture brief asks for, and every tablet worth supporting clears it.
compileSdk = "37"
minSdk = "29"
targetSdk = "37"

coroutines = "1.11.0"
serialization = "1.11.0"
ktor = "3.5.2"

compose-bom = "2026.08.00"
activity-compose = "1.13.0"
lifecycle = "2.11.0"
datastore = "1.2.1"
core-ktx = "1.19.0"

# Shizuku 13.1.5 is the current release of dev.rikka.shizuku:{api,provider} on
# Maven Central (maven-metadata.xml <release>, published 2023-09-21) -- the API
# surface has been stable since 13.0. hiddenapibypass 6.1 is the current release
# of org.lsposed.hiddenapibypass:hiddenapibypass (2025-02-11); see the comment on
# the library entries for why it is needed at all.
shizuku = "13.1.5"
hiddenapibypass = "6.1"

[libraries]
# --- :shared (multiplatform; kotlinx + ktor ONLY, no androidx) ----------------
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }

# --- tests (jvmTest source set) ----------------------------------------------
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }

# --- :app (Android only) -----------------------------------------------------
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }

# --- :app / Shizuku (docs/android-ux.md §5.2) --------------------------------
# Resolved from mavenCentral, which settings.gradle.kts already declares; the
# google() repository is content-filtered to com.android/com.google/androidx and
# is therefore never asked for these coordinates.
shizuku-api = { module = "dev.rikka.shizuku:api", version.ref = "shizuku" }
shizuku-provider = { module = "dev.rikka.shizuku:provider", version.ref = "shizuku" }

# Granting READ_LOGS means calling IPackageManager#grantRuntimePermission, and
# AOSP lists Landroid/content/pm/IPackageManager$Stub$Proxy;->grantRuntimePermission
# in boot/hiddenapi/hiddenapi-max-target-o.txt -- blocked for anything targeting
# past API 26, which is every build of this app. This library is the documented
# way past that (docs/android-ux.md §5.2 names it), and it is used lazily: it is
# not touched until the user taps Grant.
hiddenapibypass = { module = "org.lsposed.hiddenapibypass:hiddenapibypass", version.ref = "hiddenapibypass" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
