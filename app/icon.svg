  <path d="M 266.5 184 A 88 88 0 1 0 266.5 328" fill="none" stroke="#cdd6f4" stroke-width="52" stroke-linecap="round"/>
  <rect x="336" y="150" width="66" height="212" rx="16" fill="#cba6f7"/>
</svg>
