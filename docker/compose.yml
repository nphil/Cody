services:
  cody:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: cody:latest
    ports:
      # Loopback-only by default: terminals in this container run real shells,
      # so do not publish on every interface until auth is deliberately set.
      - "127.0.0.1:30177:30177"
    environment:
      # Required — the container refuses to start without it. Generate one:
      #   openssl rand -base64 24
      CODY_PASSWORD: ${CODY_PASSWORD:?set CODY_PASSWORD before starting}
      # TZ: America/New_York
    volumes:
      - ./appdata:/data          # agent state, checkpoints, shell home
      - ~/projects:/workspace    # your repositories
    restart: unless-stopped
