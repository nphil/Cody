name: Cody Desktop

# WHAT TRIGGERS A RELEASE
#
# Every push to main that touches the desktop app -- `desktop/**` or this
# workflow file -- publishes a release. There is no build-only mode: the two
# build jobs run and then `release` publishes, on every trigger. The version
# number is computed from the tags that already exist (see the `version` job)
# and injected into the build; it is not stored in the repo. workflow_dispatch
# runs the identical pipeline with manual overrides: `version` pins an exact
# number, `bump` picks patch/minor/major, `notes` is prepended to the
# generated changelog.
#
# (docker.yml's paths-ignore is the other half of this split: it lists
# `desktop/**`, `docs/windows.md` and this file, so a desktop-only push never
# cuts a container release. See docs/windows.md's CI section.)
#
# LOOP SAFETY -- two properties, both load-bearing, stop automatic releases
# from feeding themselves:
#   1. This workflow NEVER commits to main. The computed version is patched
#      into tauri.conf.json / Cargo.toml / Cargo.lock on the runner and thrown
#      away with it; only TAGS are pushed (desktop-vX.Y.Z, plus desktop-latest
#      force-moved).
#   2. The push trigger is filtered to `branches: [main]`, and GitHub matches a
#      branch-filtered push trigger only against branch pushes -- a tag push
#      does not match a trigger that has no `tags:` filter, so the tags pushed
#      below cannot re-enter here. (Belt and braces: a push made with the
#      built-in GITHUB_TOKEN does not start workflow runs at all.)
# Adding a `tags:` filter here, or committing a version bump back to main,
# turns every release into an infinite loop.
#
# RELEASE NAMESPACE AND VISIBILITY
#
# Container releases live at tags vX.Y.Z (docker.yml); desktop publishes to a
# separate, clearly-prefixed namespace. Every release run moves two releases:
#   - `desktop-vX.Y.Z` (immutable, one per version): the human-facing history.
#     An ORDINARY, VISIBLE release -- prerelease:false, so it appears in the
#     Releases list like any other -- created with `--latest=false` so it can
#     never take the repo's single /releases/latest slot. That slot belongs to
#     the container train: the ShipLog plugin on Unraid reads this repo's
#     releases as the container's changelog, and a desktop build answering
#     /releases/latest would misreport the server version. GitHub moves that
#     pointer only for a release published with make_latest true/legacy, so an
#     explicit `--latest=false` IS the isolation mechanism. (prerelease:true
#     used to be that mechanism, at the cost of burying every desktop release
#     below every container release.) The release job asserts the outcome
#     afterwards and re-hides the release if the assertion ever fails.
#   - `desktop-latest` (rolling release, force-moved tag): the machine-facing
#     update-check target, and the one release that stays prerelease:true -- it
#     is a pointer, not a changelog entry, so keeping it out of the human list
#     is deliberate. The Rust shell polls it by fixed tag/asset name via a
#     direct asset-download URL, never GitHub's own "latest" concept -- immune
#     to whatever the container namespace is doing, and vice versa. Managed
#     with the `gh` CLI (preinstalled on the runner) rather than an
#     upsert-style action, because the tag must move to a new commit on every
#     run. The release is updated in place, never deleted: it is a live
#     download channel, and deleting it would take every asset offline for the
#     minutes the several-hundred-megabyte re-upload takes. See the step for
#     the ordering that keeps it coherent.
#
# Rootfs compression is gzip, NOT zstd/xz: WSL's own docs call gzip the
# *recommended* format for `wsl --import` tarballs and warn that other
# compression formats risk breaking import compatibility with older WSL
# versions (verified in the desktop networking/import research -- this is
# the one place this file deliberately differs from the original CI design
# draft, which used zstd).
on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Exact version (X.Y.Z, no leading v). Empty = auto-increment from the newest desktop-v* tag."
        required: false
        type: string
      bump:
        description: "Increment to apply when `version` is empty."
        required: false
        default: patch
        type: choice
        options: [patch, minor, major]
      notes:
        description: "Extra release notes (markdown), prepended to the auto-generated changelog"
        required: false
        type: string

# desktop-latest is a single shared mutation target for every release run,
# and so is the tag namespace the version number is derived from: this
# serializes across the whole workflow rather than per-ref the way docker.yml
# does, so two pushes in quick succession release one after the other (0.1.1
# then 0.1.2) instead of racing for the same number.
concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------
  # The single source of the release's identity: version number and
  # changelog, computed once and consumed by every job below, so the number
  # patched into the binary, the tag, and the manifest can never disagree.
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.compute.outputs.version }}
      prev_tag: ${{ steps.compute.outputs.prev_tag }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      # Full history, because the changelog walks commits back to the
      # previous desktop tag; the default depth-1 checkout has nothing to
      # walk.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: compute
        env:
          EXPLICIT_VERSION: ${{ inputs.version }}
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail

          # Tags come from the REMOTE, not from whatever the checkout happened
          # to fetch: git only auto-follows tags that point into the fetched
          # history, and a tag missed here becomes a version number that
          # collides with an already-published, immutable release.
          tags=$(git ls-remote --tags --refs origin | sed 's#.*refs/tags/##')

          # NUMERIC comparison, field by field -- lexical order would rank
          # 0.1.9 above 0.1.10 and hand out a version that already exists.
          # The sed also enforces the shape: anything that is not a bare
          # X.Y.Z (a `-rc1` suffix, say) is not a candidate for "highest".
          prev_version=$(printf '%s\n' "$tags" \
            | sed -n 's/^desktop-v\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)$/\1/p' \
            | sort -t. -k1,1n -k2,2n -k3,3n \
            | tail -n1)

          prev_tag=""
          if [ -n "$prev_version" ]; then
            prev_tag="desktop-v${prev_version}"
          fi

          if [ -n "$EXPLICIT_VERSION" ]; then
            # A dispatch that names a version wins over everything, including
            # the bump choice -- but it still has to be a version.
            version="$EXPLICIT_VERSION"
            printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || {
              echo "::error::version input '${version}' is not X.Y.Z"
              exit 1
            }
          elif [ -z "$prev_version" ]; then
            # No desktop release has ever been cut.
            version="0.1.0"
          else
            IFS=. read -r major minor patch <<< "$prev_version"
            # Deliberately NOT implemented: inferring the bump from commit
            # subjects (`feat:` -> minor). This repo writes plain imperative
            # subjects, not Conventional Commits, so that heuristic could only
            # ever misfire. Ask for a bigger bump with the `bump` input.
            case "${BUMP:-patch}" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch|"") patch=$((patch + 1)) ;;
              *) echo "::error::unknown bump '${BUMP}' (expected patch|minor|major)"; exit 1 ;;
            esac
            version="${major}.${minor}.${patch}"
          fi

          tag="desktop-v${version}"
          # desktop-vX.Y.Z is immutable. Refuse loudly rather than let a
          # later step half-overwrite a published release's assets.
          if printf '%s\n' "$tags" | grep -Fxq "$tag"; then
            echo "::error::${tag} already exists. desktop-vX.Y.Z releases are immutable -- dispatch with a different version, or a larger bump."
            exit 1
          fi

          echo "previous: ${prev_tag:-<none>}  ->  releasing: ${tag}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prev_tag=$prev_tag" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        env:
          PREV_TAG: ${{ steps.compute.outputs.prev_tag }}
        run: |
          set -euo pipefail

          # The previous tag may point at a commit the checkout did not fetch
          # (see above), so ask for that one ref by name. A miss is not fatal:
          # the range simply falls back to the whole history.
          if [ -n "$PREV_TAG" ]; then
            git fetch --force --no-tags origin "refs/tags/${PREV_TAG}:refs/tags/${PREV_TAG}" >/dev/null 2>&1 || true
          fi

          if [ -n "$PREV_TAG" ] && git rev-parse -q --verify "refs/tags/${PREV_TAG}^{commit}" >/dev/null; then
            range="${PREV_TAG}..HEAD"
            since="since ${PREV_TAG}"
          else
            range="HEAD"
            since="in the repository's history"
          fi

          # Only commits that touched the app itself: the rootfs half of the
          # release comes from the container image, and its provenance is the
          # digest line at the bottom of the body, not this list.
          # De-duplicated by subject (a cherry-pick or a re-landed commit
          # would otherwise appear twice), newest first, which is git log's
          # own order.
          bullets=$(git log --no-merges --format='%s%x09%h' "$range" -- desktop/ \
            | awk -F'\t' 'NF && !seen[$1]++ { printf "- %s (%s)\n", $1, $2 }')

          delim="DESKTOP_EOF_$(openssl rand -hex 8)"
          {
            echo "changelog<<${delim}"
            if [ -n "$bullets" ]; then
              printf '%s\n' "$bullets"
            else
              # Say so out loud rather than publish an empty section: a
              # release with no app commits is a real thing here (a CI change
              # triggers one), and it still ships a freshly snapshotted
              # runtime.
              echo "_No \`desktop/\` changes ${since}. This release rebuilds the shell and re-snapshots the runtime from the current container image._"
            fi
            echo "${delim}"
          } >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------
  # Windows installer. windows-latest is Windows Server 2025 + VS2026 as of
  # the June 2026 image migration. Verified against the live runner-images
  # manifest:
  #   - NSIS is NOT preinstalled (it was on the older windows-2022 image;
  #     dropped from windows-2025). No separate install step needed anyway:
  #     Tauri's bundler downloads and hash-verifies its own NSIS toolchain
  #     into a cache dir the first time it finds NSIS missing -- a one-time
  #     tax on a cold cache, free once rust-cache hits.
  #   - jq ships preinstalled on this image (verified: "jq 1.8.1" in the
  #     current Windows2025-VS2026 manifest) -- no install step needed for
  #     the version-patch step below.
  #   - WebView2 isn't itemized by name, but Windows Server 2025 ships
  #     current Edge and the OS-level WebView2 runtime Tauri needs the same
  #     way Tauri's docs describe for Windows 10 (April 2018+)/11 -- nothing
  #     extra to install for the default "downloaded bootstrapper" mode.
  #   - Rust/Cargo/Rustup are already on the image, but we still pin via
  #     dtolnay/rust-toolchain for a reproducible, explicit version instead
  #     of depending on whatever the image happens to preinstall.
  shell-build:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Runs on EVERY trigger, because every trigger releases: the version is
      # computed from the tags, never committed, so the working tree always
      # arrives here carrying a stale number.
      #
      # All three files move together. tauri.conf.json alone names the bundle,
      # but the binary reports CARGO_PKG_VERSION, and that is what the updater
      # compares the manifest against: patch only the config and every
      # installer ever shipped calls itself 0.1.0, so every update check finds
      # the manifest "newer" and reinstalls, forever. desktop/src-tauri/
      # build.rs asserts the two agree, so a miss here fails the build below
      # rather than shipping.
      - name: Set app version
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          tmp=$(mktemp)
          jq --arg v "$VERSION" '.version = $v' desktop/src-tauri/tauri.conf.json > "$tmp"
          mv "$tmp" desktop/src-tauri/tauri.conf.json

          # The first `^version = ` line is [package]'s: it is the first
          # section, and every dependency version sits inside an inline table.
          sed -i "0,/^version = /{s/^version = .*/version = \"${VERSION}\"/}" desktop/src-tauri/Cargo.toml
          # The lock records the crate's own version too; leaving it stale
          # makes the build stop to rewrite the lockfile.
          sed -i "/^name = \"cody-desktop\"\$/{n;s/^version = .*/version = \"${VERSION}\"/}" desktop/src-tauri/Cargo.lock

          # Checked, not assumed: a sed that silently matched nothing would
          # otherwise ship the old version.
          check() {
            [ "$2" = "$3" ] || { echo "::error::$1 was not set to ${VERSION} (found: $2)"; exit 1; }
          }
          check tauri.conf.json \
            "$(jq -r .version desktop/src-tauri/tauri.conf.json)" "$VERSION"
          check Cargo.toml \
            "$(grep -m1 '^version = ' desktop/src-tauri/Cargo.toml)" "version = \"${VERSION}\""
          check Cargo.lock \
            "$(grep -A1 '^name = "cody-desktop"$' desktop/src-tauri/Cargo.lock | tail -n1)" "version = \"${VERSION}\""

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop/src-tauri -> target"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      # Verified current (2026) recommendation: the npm-distributed CLI is
      # a prebuilt native addon (installs in seconds) vs. `cargo install
      # tauri-cli` / cargo-binstall, which still resolve/link a Rust
      # binary. Pinning it as a desktop/package.json devDependency also
      # means this version travels with the repo instead of drifting to
      # whatever "latest" resolves to on build day.
      - name: Install frontend deps + Tauri CLI (npm)
        working-directory: desktop
        run: npm ci

      - name: tauri build
        working-directory: desktop
        shell: bash
        env:
          # Fixed regardless of which version is being built (it's the
          # rolling channel, not a per-version URL). The Rust shell reads it
          # via option_env! at compile time; exact consumption is reconciled
          # at integration.
          CODY_DESKTOP_MANIFEST_URL: https://github.com/nphil/Cody/releases/download/desktop-latest/desktop-manifest.json
        run: npx tauri build

      # NOTE -- not wired in yet: once desktop/ ships a `--self-test` flag
      # (parse argv before tauri::Builder::default().run(), exit 0 before
      # any window is created), a smoke step belongs right here:
      #   - name: Self-test the built exe
      #     shell: bash
      #     timeout-minutes: 2
      #     run: |
      #       exe=$(ls src-tauri/target/release/bundle/nsis/*.exe | head -n1)
      #       "$exe" --self-test
      # windows-latest can run it today with no extra setup -- unlike Linux
      # runners, GH's Windows (and macOS) runners execute jobs in a real
      # interactive desktop session, so a GUI process can create a window
      # here without Xvfb or similar. That's exactly why the flag needs to
      # exit *before* window creation: the runner won't fail for lack of a
      # display, it'll just hang forever waiting on a window nothing will
      # ever close.
      - name: Stage installer artifact
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          src=$(ls desktop/src-tauri/target/release/bundle/nsis/*.exe | head -n1)
          cp "$src" "dist/cody-desktop-${VERSION}-x64-setup.exe"
          sha256sum "dist/cody-desktop-${VERSION}-x64-setup.exe" > "dist/cody-desktop-${VERSION}-x64-setup.exe.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-installer
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------
  # Rootfs snapshot of the ALREADY-published container image, so the
  # desktop app can offer "install the Cody server locally" without the
  # user needing Docker/GHCR access themselves. Image is public
  # (docs/unraid.md), so no registry login needed to pull it. Runs on every
  # trigger now that every trigger publishes -- and it deliberately does not
  # depend on the `version` job: the artifact is keyed by the CONTAINER's
  # version, so it can build in parallel with the shell.
  rootfs-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      cody_version: ${{ steps.snapshot.outputs.cody_version }}
      image_digest: ${{ steps.snapshot.outputs.image_digest }}
    steps:
      # No checkout needed: this job only reads the already-published
      # container image, never repo files -- the rootfs artifact name is
      # keyed by the CONTAINER's own version label (cody_version below),
      # not the desktop app's version.
      - name: Snapshot ghcr.io/nphil/cody:latest
        id: snapshot
        run: |
          set -euo pipefail
          docker pull ghcr.io/nphil/cody:latest

          cody_version=$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' ghcr.io/nphil/cody:latest)
          image_digest=$(docker inspect --format '{{ index .RepoDigests 0 }}' ghcr.io/nphil/cody:latest)
          echo "cody_version=$cody_version" >> "$GITHUB_OUTPUT"
          echo "image_digest=$image_digest" >> "$GITHUB_OUTPUT"
          echo "source image: $image_digest (cody $cody_version)"

          cid=$(docker create ghcr.io/nphil/cody:latest)
          mkdir -p rootfs dist

          # docker create (not run) so the snapshot is exactly the image's
          # baked-in layers -- nothing runtime-generated (SSH host keys,
          # account state, logs) ever gets a chance to exist, since no
          # process is started. Excludes below are packaging fat only:
          #   - /var/lib/apt/lists is already emptied at image-build time
          #     (docker/Dockerfile: `rm -rf /var/lib/apt/lists/*`), so it is
          #     NOT listed here -- there is nothing left there to strip.
          #   - doc/man/locale: Cody ships its own i18n (lib/i18n:
          #     en/ja/zh-CN); OS-level message catalogs for the bundled CLI
          #     tools are an unused soft dependency (missing = English
          #     fallback, not a crash).
          #
          # Excluding at extract time (not `tar --delete` on the exported
          # archive) is the robust route: `docker export` streams straight
          # into the pipe below, and GNU tar's --delete needs random access
          # to the archive -- it cannot operate on a pipe/stdin at all.
          # Excluding here means the stripped paths never touch disk.
          docker export "$cid" | tar -x -C rootfs \
            --exclude='usr/share/doc/*' \
            --exclude='usr/share/man/*' \
            --exclude='usr/share/locale/*'
          docker rm "$cid" >/dev/null

          echo "extracted size: $(du -sh rootfs | cut -f1)"

          # gzip, NOT zstd/xz -- see the top-of-file note. pigz parallelizes
          # the gzip -9 pass across cores; it ships preinstalled on this
          # image (verified: "pigz | 2.8-1" in the current Ubuntu 24.04
          # runner-images apt package list), so no install step is needed.
          out="dist/rootfs-cody-${cody_version}.tar.gz"
          tar -cf - -C rootfs . | pigz -9 > "$out"
          sha256sum "$out" > "$out.sha256"

          # Hard size assertion: fail loudly, with the exact byte count,
          # before ever attempting to attach the asset to a release --
          # rather than a cryptic upload failure downstream.
          # 1990 MiB = 2,086,666,240 bytes: headroom under GitHub's 2 GiB
          # (2,147,483,648 byte) hard per-asset limit.
          limit=2086666240
          size=$(stat -c%s "$out")
          echo "compressed rootfs size: $size bytes (limit: $limit bytes / 1990 MiB)"
          if [ "$size" -gt "$limit" ]; then
            echo "::error::rootfs asset is ${size} bytes, over the ${limit}-byte (1990 MiB) safety threshold. Tighten the excludes above or split the asset."
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-rootfs
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------
  release:
    # success() is spelled out even though it's GitHub's implicit default
    # for an `if:` with no status-check function -- explicit here so a
    # failed shell-build/rootfs-build visibly skips this job instead of
    # relying on a reader already knowing that default.
    if: success()
    needs: [version, shell-build, rootfs-build]
    runs-on: ubuntu-latest
    # Generous: the rootfs is uploaded twice (once per release) at several
    # hundred megabytes a time, and a timeout here means a build that already
    # passed never ships.
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true

      - uses: actions/download-artifact@v8
        with:
          name: desktop-installer
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: desktop-rootfs
          path: dist

      - name: Build desktop-manifest.json + release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
          CHANGELOG: ${{ needs.version.outputs.changelog }}
          NOTES_INPUT: ${{ inputs.notes }}
          CODY_VERSION: ${{ needs.rootfs-build.outputs.cody_version }}
          IMAGE_DIGEST: ${{ needs.rootfs-build.outputs.image_digest }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          installer="cody-desktop-${VERSION}-x64-setup.exe"
          rootfs="rootfs-cody-${CODY_VERSION}.tar.gz"
          installer_sha=$(cut -d' ' -f1 "dist/${installer}.sha256")
          rootfs_sha=$(cut -d' ' -f1 "dist/${rootfs}.sha256")
          base="https://github.com/${REPO}/releases/download/desktop-latest"
          published_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          # Operator notes (dispatch only) come first, then the generated
          # changelog -- one text used for both the manifest and the release
          # body, so the two can never tell different stories.
          notes_text="$CHANGELOG"
          if [ -n "$NOTES_INPUT" ]; then
            notes_text=$(printf '%s\n\n%s' "$NOTES_INPUT" "$CHANGELOG")
          fi

          # Shape is the Rust updater's Manifest struct (desktop/src-tauri/
          # src/update.rs): {shell, runtime} of {version, url, sha256, size},
          # plus runtime.imageDigest. That digest is inside the runtime object
          # because the updater reads it there and compares it with the digest
          # marker in the installed distro -- it is the only signal that
          # catches a :latest republish, which usually carries the same
          # version label. The top-level copy is for humans; serde ignores it.
          installer_size=$(stat -c%s "dist/${installer}")
          rootfs_size=$(stat -c%s "dist/${rootfs}")
          jq -n \
            --arg shellVersion "$VERSION" \
            --arg shellUrl "${base}/${installer}" \
            --arg shellSha "$installer_sha" \
            --argjson shellSize "$installer_size" \
            --arg runtimeVersion "$CODY_VERSION" \
            --arg runtimeUrl "${base}/${rootfs}" \
            --arg runtimeSha "$rootfs_sha" \
            --argjson runtimeSize "$rootfs_size" \
            --arg publishedAt "$published_at" \
            --arg imageDigest "$IMAGE_DIGEST" \
            --arg notes "$notes_text" \
            '{shell: {version:$shellVersion, url:$shellUrl, sha256:$shellSha, size:$shellSize},
              runtime: {version:$runtimeVersion, url:$runtimeUrl, sha256:$runtimeSha, size:$runtimeSize,
                        imageDigest:$imageDigest},
              publishedAt:$publishedAt, imageDigest:$imageDigest, notes:$notes}' \
            > dist/desktop-manifest.json
          cat dist/desktop-manifest.json

          # Written to a file, not $GITHUB_OUTPUT: `gh release create` takes
          # --notes-file, and a file needs no delimiter games with arbitrary
          # commit subjects. RUNNER_TEMP, not dist/, so it never gets picked
          # up by the asset globs below.
          {
            if [ -n "$NOTES_INPUT" ]; then
              printf '%s\n\n' "$NOTES_INPUT"
            fi
            echo '### Changes'
            echo
            printf '%s\n\n' "$CHANGELOG"
            echo '## Artifacts'
            echo
            echo '| Asset | SHA-256 |'
            echo '| --- | --- |'
            echo "| \`${installer}\` | \`${installer_sha}\` |"
            echo "| \`${rootfs}\` | \`${rootfs_sha}\` |"
            echo '| `desktop-manifest.json` | see file |'
            echo
            echo "Rootfs flattened from \`ghcr.io/nphil/cody:latest\` at \`${IMAGE_DIGEST}\` (Cody ${CODY_VERSION})."
          } > "${RUNNER_TEMP}/release-notes.md"
          cat "${RUNNER_TEMP}/release-notes.md"

      # Immutable per-version release: desktop's own history/changelog, and an
      # ordinary visible release. `--latest=false` is the load-bearing flag --
      # see the top-of-file comment: without it GitHub would hand this release
      # the repo's /releases/latest slot, which the container train owns. No
      # --prerelease, deliberately: these are stable builds and burying them
      # was the old workaround for exactly the problem --latest=false solves.
      # `gh` rather than an action so the flags are the API's own vocabulary.
      - name: Publish desktop-vX.Y.Z (history)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "desktop-v${VERSION}" \
            --title "Cody Desktop ${VERSION}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md" \
            --target "${GITHUB_SHA}" \
            --latest=false \
            dist/cody-desktop-*-x64-setup.exe \
            dist/cody-desktop-*-x64-setup.exe.sha256 \
            dist/rootfs-cody-*.tar.gz \
            dist/rootfs-cody-*.tar.gz.sha256 \
            dist/desktop-manifest.json

      # Backfill, kept because it is idempotent and costs one API call once it
      # has converged: desktop releases published before the visibility change
      # are still prerelease:true and would stay buried forever. Only
      # `desktop-v*` is touched -- desktop-latest stays a prerelease on
      # purpose, and container releases never match the prefix. make_latest is
      # passed explicitly because PATCHing a release without it defaults to
      # true, which is exactly the slot-grab this whole design prevents.
      - name: Make older desktop releases visible
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/${REPO}/releases?per_page=100" \
            --jq '.[] | select(.prerelease) | select(.tag_name | startswith("desktop-v")) | .id' \
          | while read -r id; do
              [ -n "$id" ] || continue
              gh api --method PATCH "repos/${REPO}/releases/${id}" \
                -F prerelease=false -f make_latest=false \
                --jq '"made visible: " + .tag_name'
            done

      # The acceptance check for the namespace split, asserted rather than
      # assumed: this release must be visible, and the repo's single
      # /releases/latest slot must still answer with a container release --
      # the ShipLog plugin on Unraid reads it as the server's version. If a
      # desktop release ever wins that slot, hide it again immediately (the
      # old prerelease trick, applied surgically) and fail the run.
      - name: Verify visibility and that the container keeps /releases/latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          pre=$(gh api "repos/${REPO}/releases/tags/desktop-v${VERSION}" --jq '.prerelease')
          [ "$pre" = "false" ] || {
            echo "::error::desktop-v${VERSION} published as a prerelease; it will be buried in the Releases list."
            exit 1
          }

          # A 404 here means no release owns the slot at all, which is not a
          # desktop hijack -- only a desktop tag answering it is a failure.
          latest=$(gh api "repos/${REPO}/releases/latest" --jq '.tag_name' 2>/dev/null || echo "<none>")
          echo "repo /releases/latest -> ${latest}"
          case "$latest" in
            desktop-*)
              echo "::error::${latest} took the repo's /releases/latest slot, which belongs to the container train. Re-hiding it."
              gh release edit "$latest" --prerelease
              exit 1
              ;;
          esac
          echo "desktop-v${VERSION} is visible and the container still owns /releases/latest"

      # Rolling pointer: this is the ONLY thing the desktop app's Rust
      # updater ever polls -- by fixed tag + fixed asset name, never
      # GitHub's /releases/latest (that endpoint belongs to the container
      # namespace, see the top-of-file comment). Managed directly with the
      # `gh` CLI rather than an upsert-style action, because the tag has to
      # move to a new commit on every run.
      #
      # The release itself is NEVER deleted and re-created. Deleting it takes
      # every asset offline for the several minutes the rootfs upload runs, so
      # every client polling in that window 404s and every first run started in
      # it fails outright. Updating in place means the worst a client sees is
      # the *previous*, entirely coherent set: the old manifest still names the
      # old assets, and those stay in place until the new manifest replaces
      # them (the rootfs and installer names carry their version, so the new
      # uploads never clobber the old ones).
      - name: Move desktop-latest (rolling update channel)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          if ! gh release view desktop-latest > /dev/null 2>&1; then
            gh release create desktop-latest \
              --title "Cody Desktop (latest: ${VERSION})" \
              --notes "Rolling update channel polled by the desktop app's built-in updater." \
              --prerelease \
              --target "${GITHUB_SHA}"
          fi

          # Retarget the rolling tag at this commit; the release keeps its
          # identity, and its assets, while the tag moves under it.
          # actions/checkout leaves its credentials in place, so this pushes
          # with the same GITHUB_TOKEN (the job holds contents: write).
          # Pushing a TAG cannot re-trigger this workflow -- see the loop
          # safety note at the top of the file.
          git tag -f desktop-latest "${GITHUB_SHA}"
          git push -f origin refs/tags/desktop-latest

          gh release edit desktop-latest \
            --title "Cody Desktop (latest: ${VERSION})" \
            --notes "Rolling update channel polled by the desktop app's built-in updater. See desktop-v${VERSION} for the full changelog."

          # ORDER MATTERS, and this is the whole point of the step: every
          # asset goes up before the manifest that names it. Clients read
          # desktop-manifest.json and then follow its URLs, so the manifest
          # must never be the first thing to land.
          for asset in \
            dist/cody-desktop-*-x64-setup.exe \
            dist/cody-desktop-*-x64-setup.exe.sha256 \
            dist/rootfs-cody-*.tar.gz \
            dist/rootfs-cody-*.tar.gz.sha256
          do
            gh release upload desktop-latest "$asset" --clobber
          done
          gh release upload desktop-latest dist/desktop-manifest.json --clobber

          # ...and only NOW drop what the new manifest does not reference.
          # Until the line above, the old manifest was the live one and these
          # were the assets it pointed at; deleting them any earlier is the
          # same outage as deleting the release. Without this pass the
          # release grows by a full rootfs every version.
          # Assigned, not inlined into the loop: a jq that failed inside a
          # `for` list would silently leave the keep-set empty, and this loop
          # would then delete the assets that were just uploaded.
          referenced=$(jq -r '.shell.url, .runtime.url' dist/desktop-manifest.json | sed 's#.*/##')
          keep="desktop-manifest.json"
          for name in $referenced; do
            keep="${keep} ${name} ${name}.sha256"
          done
          for asset in $(gh release view desktop-latest --json assets --jq '.assets[].name'); do
            case " ${keep} " in
              *" ${asset} "*) ;;
              *) gh release delete-asset desktop-latest "$asset" --yes ;;
            esac
          done
