name: Publish container image

# Unraid's update check compares the local image digest against the registry,
# so the image has to LIVE in a registry for "check for updates" to ever fire.
# Every push to main republishes :latest; tags publish their version too.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: meta
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build once into the local daemon and prove the image actually runs
      # before anything reaches the registry. A published :latest is pulled
      # automatically by downstream hosts, so a broken one is a broken server,
      # not a red check. The push step below re-uses this build from cache.
      - name: Build for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: cody:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          set -euo pipefail
          # The harness has to be runnable, not merely installed.
          docker run --rm cody:smoke omp --version
          docker run -d --name cody-smoke -p 30177:30177 \
            -e CODY_PASSWORD=smoke-test-password cody:smoke
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:30177/ || echo 000)
            # 401 is the healthy state: the server is up and demanding auth.
            if [ "$code" = "401" ]; then
              echo "server up (HTTP $code)"
              # Informational: the settings panel degrades to Cody's own
              # controls when OMP's schema cannot be read, so a miss here is
              # worth seeing in the log but must not block a release.
              if curl -sf -u "cody:smoke-test-password" \
                   http://127.0.0.1:30177/api/omp-settings/schema \
                   | grep -q '"settings"'; then
                echo "omp settings schema served"
              else
                echo "::warning::omp settings schema did not load in the image"
              fi
              docker rm -f cody-smoke >/dev/null
              exit 0
            fi
            sleep 2
          done
          echo "server never became ready" >&2
          docker logs cody-smoke >&2 || true
          docker rm -f cody-smoke >/dev/null || true
          exit 1

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          # Unraid is x86; a second arch would double build time for no gain.
          platforms: linux/amd64
          push: true
          # :latest tracks main only — tagging an older commit must never move
          # it backwards. The version tag is immutable-by-convention: it is
          # published from tag builds, where the version is pinned to the ref.
          tags: |
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}/cody:latest', github.repository_owner) || '' }}
            ghcr.io/${{ github.repository_owner }}/cody:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/cody:sha-${{ github.sha }}
          # Update-tracking tools (and Unraid itself) read the version label.
          labels: |
            org.opencontainers.image.title=Cody
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
